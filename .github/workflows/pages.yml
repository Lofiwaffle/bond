name: Installable web app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Load hosted Supabase config
        run: |
          python3 - <<'PY'
          import json, os
          cfg = json.load(open("public/supabase.json"))
          url, key = cfg["url"].strip(), cfg["key"].strip()
          if not url.startswith("https://") or not key.startswith("sb_publishable_"):
              raise SystemExit("public/supabase.json must contain the hosted https URL and an sb_publishable key")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"EXPO_PUBLIC_SUPABASE_URL={url}\n")
              fh.write(f"EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY={key}\n")
          PY
      - name: Export web app
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_BASE_PATH: /bond
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: GitHub Pages SPA fallback
        run: python3 scripts/patch-web-export.py
      - name: Write hosted supabase config
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ env.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: python3 scripts/write-supabase-config.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
