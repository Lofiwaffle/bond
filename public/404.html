<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bond</title>
    <script>
      (function () {
        var params = new URLSearchParams(location.search)
        var hash = location.hash || ''
        var auth =
          params.get('code') ||
          params.get('token_hash') ||
          params.get('access_token') ||
          /access_token=|code=|token_hash=/.test(hash)
        if (auth) {
          location.replace('bond://auth-callback' + location.search + hash)
          return
        }
        var path = location.pathname.replace(/^\/bond/, '')
        var parts = path.split('/').filter(Boolean)
        if (parts[0] === 'join' && parts[1] && !params.get('invite')) {
          params.set('invite', String(parts[1]).toUpperCase())
        }
        var query = params.toString()
        location.replace('/bond/' + (query ? '?' + query : ''))
      })()
    </script>
  </head>
  <body>Opening Bond…</body>
</html>
